# golangci-lint v2 config. Deliberately a small set: every linter here is
# green on the current code, so the CI lint job fails only on new issues.
# revive runs with var-naming only: it enforces the URL/HTTP/ID
# initialism convention. Its other rules are deliberately off — the
# exported rule would force every handler comment into the "Name ..."
# form, and the route-style comments (GET /short-urls ...) are more
# useful than that.
version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - revive
  settings:
    revive:
      rules:
        - name: var-naming
formatters:
  enable:
    - gofmt
    - goimports
